name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Validate release branch
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release branches must be named release/X.Y.Z; received: $HEAD_REF" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check out merged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@kyaulabs'

      - name: Verify package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const expected = process.env.VERSION;
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lockfile = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const versions = {
            'package.json': manifest.version,
            'package-lock.json': lockfile.version,
            'package-lock.json root package': lockfile.packages?.['']?.version,
          };

          for (const [file, actual] of Object.entries(versions)) {
            if (actual !== expected) {
              throw new Error(`${file} version ${String(actual)} does not match release/${expected}`);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run check

      - name: Build npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --silent)"
          test -f "$package_file"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Select changelog range
        id: changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # A rerun may find the release tag left by an earlier partial run.
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git tag --delete "$TAG"
          fi

          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            echo "range=$previous_tag..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=--unreleased" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.changelog.outputs.range }} --tag ${{ steps.release.outputs.tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create and push tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [[ -z "$remote_tag" ]]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          fi

          if [[ -n "$remote_tag" ]]; then
            if [[ "$remote_tag" != "$MERGE_SHA" ]]; then
              echo "$TAG already exists at $remote_tag, expected $MERGE_SHA" >&2
              exit 1
            fi
            echo "$TAG already points to the merged release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" "$MERGE_SHA" --message "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          if npm view "$package_name@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$package_name@$VERSION is already published to GitHub Packages"
          else
            npm publish "$PACKAGE_FILE" --registry=https://npm.pkg.github.com --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$TAG" "$PACKAGE_FILE" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi

      - name: Open back-merge pull request
        env:
          GH_TOKEN: ${{ secrets.BACKMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Back-merge pull request #$existing_pr is already open"
          else
            gh pr create \
              --base develop \
              --head main \
              --title "chore(release): back-merge $TAG into develop" \
              --body "Back-merges the changes released as [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) into \`develop\`."
          fi
